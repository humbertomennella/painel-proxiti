name: PROXITI | Interface responsiva
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "tests/browser-smoke.mjs"
      - "tests/overview-functional.mjs"
      - "tests/tickets-functional.mjs"
      - "tests/agenda-functional.mjs"
      - "tests/academy-functional.mjs"
      - "tests/academy-learning-functional.mjs"
      - "tests/reskin-visual.mjs"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "tests/browser-smoke.mjs"
      - "tests/overview-functional.mjs"
      - "tests/tickets-functional.mjs"
      - "tests/agenda-functional.mjs"
      - "tests/academy-functional.mjs"
      - "tests/academy-learning-functional.mjs"
      - "tests/reskin-visual.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspecionar experiência móvel e desktop
        run: node tests/browser-smoke.mjs
      - name: Verificar fluxos da Visão Geral com sessões simuladas
        run: node tests/overview-functional.mjs
      - name: Verificar fluxos completos de chamados e falhas com dados simulados
        run: node tests/tickets-functional.mjs
      - name: Verificar agenda com confirmação, paginação, reagendamento e permissões
        run: node tests/agenda-functional.mjs
      - name: Verificar Academia com busca, publicação, revisão e privacidade
        run: node tests/academy-functional.mjs
      - name: Verificar aulas, prova final, nota e certificado interno
        run: node tests/academy-learning-functional.mjs
      - name: Auditoria visual sem alterações em auth, dados ou permissões
        if: github.event_name == 'pull_request' && github.head_ref == 'reskin-visual'
        run: node tests/reskin-visual.mjs
      - name: Guardar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxiti-central-visual-smoke
          path: artifacts/*.png
          if-no-files-found: ignore
