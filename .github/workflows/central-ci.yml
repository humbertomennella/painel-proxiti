name: PROXITI | Verificação da Central
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/central-ci.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/central-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridade estática
        run: node tests/central-integrity.mjs
      - name: Validar motor de diagnóstico local e segurança
        run: node tests/ticket-diagnostics-core.mjs
      - name: Validar operação comercial e segurança dos valores
        run: |
          node --check assets/commercial-core.js
          node --check assets/commercial-v15.js
          node tests/commercial-v15-integrity.mjs
      - name: Validar scripts e certificação UNIPROXITI V14
        run: |
          node --check assets/academy-learning.js
          node --check assets/academy-curriculum.js
          node tests/uniproxiti-v14-integrity.mjs
