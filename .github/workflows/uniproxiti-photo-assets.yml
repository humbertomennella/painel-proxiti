name: UNIPROXITI | Importar fotos de referência
on:
  push:
    branches: [feature/uniproxiti-curriculos-certificados-20260927]
    paths: ['.github/workflows/uniproxiti-photo-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uniproxiti-curriculos-certificados-20260927
          fetch-depth: 0
      - name: Baixar e validar fotos com licença Pexels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          curl --fail --location --retry 2 --max-time 50 --silent --show-error 'https://images.pexels.com/photos/5951759/pexels-photo-5951759.jpeg?auto=compress&cs=tinysrgb&w=880&h=495&fit=crop' -o assets/photos/backup-pexels.jpg
          curl --fail --location --retry 2 --max-time 50 --silent --show-error 'https://images.pexels.com/photos/4973899/pexels-photo-4973899.jpeg?auto=compress&cs=tinysrgb&w=880&h=495&fit=crop' -o assets/photos/privacidade-pexels.jpg
          curl --fail --location --retry 2 --max-time 50 --silent --show-error 'https://images.pexels.com/photos/7689876/pexels-photo-7689876.jpeg?auto=compress&cs=tinysrgb&w=880&h=495&fit=crop' -o assets/photos/operacao-pexels.jpg
          for photo in assets/photos/{backup,privacidade,operacao}-pexels.jpg; do
            test "$(file --mime-type --brief "$photo")" = image/jpeg
            size=$(wc -c < "$photo")
            test "$size" -gt 10000 && test "$size" -lt 350000
            printf '%s: %s bytes\n' "$photo" "$size"
          done
      - name: Registrar as três fotos originais no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/backup-pexels.jpg assets/photos/privacidade-pexels.jpg assets/photos/operacao-pexels.jpg
          git commit -m 'assets(uniproxiti): adicionar três capas temáticas com licença Pexels'
          git push origin HEAD:feature/uniproxiti-curriculos-certificados-20260927
